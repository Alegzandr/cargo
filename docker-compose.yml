# Production-shape compose at the repo root.
# Mirrors deploy/compose.yml but builds locally (no registry image required),
# for single-host operators deploying without GitLab CI. CI uses deploy/compose.yml.
#
# Required env (pass via shell or .env):
#   APP_HOST            host name behind Traefik (e.g. cargo.example.com)
#   CARGO_MASTER_KEY    base64(32 bytes)
#   AUTH_SECRET         long random
#   AUTH_DISCORD_ID     Discord application client id
#   AUTH_DISCORD_SECRET Discord application client secret
#   DB_PASSWORD         postgres password
#   DATA_DIR            host path for persistent data (e.g. /mnt/cargo)
#   TRAEFIK_NETWORK     external Traefik network name (default: traefik)
#
# Local dev: use docker-compose.dev.yml instead.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cargo}
      POSTGRES_USER: ${DB_USERNAME:-cargo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - ${DATA_DIR:?DATA_DIR must be set}/postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cargo} -d ${DB_DATABASE:-cargo}"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_URL: https://${APP_HOST:?APP_HOST must be set}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:?AUTH_DISCORD_ID must be set}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:?AUTH_DISCORD_SECRET must be set}
      CARGO_MASTER_KEY: ${CARGO_MASTER_KEY:?CARGO_MASTER_KEY must be set}
      DATABASE_URL: postgres://${DB_USERNAME:-cargo}:${DB_PASSWORD}@db:5432/${DB_DATABASE:-cargo}
      CARGO_BLOB_PATH: /var/lib/cargo/blobs
      CARGO_MAX_FILE_SIZE: ${CARGO_MAX_FILE_SIZE:-214748364800}
      CARGO_USER_QUOTA: ${CARGO_USER_QUOTA:-214748364800}
      CARGO_LINK_TTL_SECONDS: ${CARGO_LINK_TTL_SECONDS:-3600}
      LOG_LEVEL: warning
    volumes:
      - ${DATA_DIR}/blobs:/var/lib/cargo/blobs
      - ${DATA_DIR}/logs:/app/logs
    depends_on:
      db: { condition: service_healthy }
    networks: [traefik, internal]
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.cargo.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.cargo.entrypoints=websecure
      - traefik.http.routers.cargo.tls=true
      - traefik.http.services.cargo.loadbalancer.server.port=3000
      - traefik.http.routers.cargo.middlewares=cargo-noindex@docker
      - traefik.http.middlewares.cargo-noindex.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow, noarchive

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["worker"]
    # The cleanup worker only deletes rows and unlinks files — it has no need
    # for CARGO_MASTER_KEY, so we don't even mount it.
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      DATABASE_URL: postgres://${DB_USERNAME:-cargo}:${DB_PASSWORD}@db:5432/${DB_DATABASE:-cargo}
      CARGO_BLOB_PATH: /var/lib/cargo/blobs
      LOG_LEVEL: warning
    volumes:
      - ${DATA_DIR}/blobs:/var/lib/cargo/blobs
      - ${DATA_DIR}/logs:/app/logs
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
  internal:
    driver: bridge
